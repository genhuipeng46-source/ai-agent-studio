    background: linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);

  }
  .hero { text-align: center; margin-bottom: 22px; }
  .pill {
    display: inline-block; background: #0f172a; color: #f8fafc;

  }
  h1 { font-size: 36px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 10px; }

    background: linear-gradient(90deg, #0066ff, #5b5ce6);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }

  .tip {
    background: #ffffff; color: #334155; border: 1px solid #e2e8f0;

    margin: 20px 0 24px; box-shadow: 0 4px 16px rgba(15,23,42,0.04);
  }
  .tip b { color: #1d4ed8; }

  .tabs {
    display: flex; gap: 10px; justify-content: center; margin-bottom: 28px; flex-wrap: wrap;
  }
  .tab {
    background: #fff; border: 1.5px solid #e2e8f0; border-radius: 999px;
    padding: 9px 18px; font-size: 14px; font-weight: 700; cursor: pointer; color: #334155;
    transition: all 0.16s ease;
  }
  .tab:hover { border-color: #93c5fd; color: #1d4ed8; }
  .tab.active {
    background: #2563eb; color: #fff; border-color: #2563eb;
    box-shadow: 0 6px 16px rgba(37,99,235,0.22);
  }

  .section-wrap { margin-bottom: 32px; }
  .sec-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px; padding: 0 4px;
  }
  .sec-title {
    font-size: 21px; font-weight: 800; color: #0f172a; display: flex; align-items: center; gap: 10px;
  }
  .sec-count {
    font-size: 13px; font-weight: 700; padding: 3px 12px; border-radius: 999px;
    background: #e2e8f0; color: #334155;
  }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(510px, 1fr)); gap: 16px; }
  .card {
    background: #fff; border-radius: 22px; padding: 20px 22px;
    box-shadow: 0 10px 26px rgba(15,23,42,0.045); border: 1px solid rgba(15,23,42,0.06);
    display: flex; flex-direction: column; gap: 12px;
  }
  .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .badge {
    display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; margin-bottom: 6px;
  }
  .title { font-size: 16px; font-weight: 700; color: #0f172a; line-height: 1.4; }
  .copy-btn {
    background: linear-gradient(90deg, #0066ff, #4f46e5); color: #fff; border: none;
    border-radius: 10px; padding: 8px 14px; font-size: 13px; font-weight: 700;
    cursor: pointer; white-space: nowrap; flex-shrink: 0; transition: opacity 0.15s;
  }
  .copy-btn:hover { opacity: 0.9; }
  .copy-btn.done { background: #059669; }
  pre {
    background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 14px;
    padding: 14px; font-size: 13px; line-height: 1.65; color: #1e293b;
    white-space: pre-wrap; word-break: break-word;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    max-height: 240px; overflow-y: auto;
  }
</style>

<script>
const PROJECTS = [{"id": "manuals", "name": "📖 技能接口文档", "color": "#7c3aed", "bg": "#f5f3ff", "steps": [["🎨 火山方舟 · Seedream 图像生成 API 文档", "# 火山方舟 · Seedream 图像生成 API 文档\n\n## 接口简介\n调用火山方舟豆包文生图大模型，支持批量并发生成 9:16 高清电影级竖屏分镜画面。\n\n## 端点与鉴权\n- 请求地址：`POST https://ark.cn-beijing.volces.com/api/v3/images/generations`\n- 鉴权方式：`Authorization: Bearer $ARK_API_KEY`（读取已配置的环境变量 `ARK_API_KEY`）\n- 默认模型：读取环境变量 `ARK_IMAGE_MODEL`（默认 `doubao-seedream-4-5-251128`）\n\n## 核心调用参数\n- `size`：`\"1600x2848\"`（9:16 高清竖屏比例）\n- `response_format`：`\"url\"`（返回公网直连图片 URL，供后续视频生成与草稿合成直接引用）\n- `watermark`：`false`\n\n## 工程输出规范\n- 多张配图任务采用多线程或异步方式一次性并发提交；\n- 将全部本地图片路径与公网 URL 清单写入 `manifest_images.json`。"], ["🎬 火山方舟 · Seedance 首尾帧视频生成 API 文档", "# 火山方舟 · Seedance 首尾帧视频生成 API 文档\n\n## 接口简介\n调用火山方舟豆包视频生成大模型，将相邻两张静态画面作为首帧与尾帧，批量并发生成一镜到底的平滑转场视频。\n\n## 端点与鉴权\n- 提交任务：`POST https://ark.cn-beijing.volces.com/api/v3/contents/generations/tasks`\n- 查询状态：`GET https://ark.cn-beijing.volces.com/api/v3/contents/generations/tasks/{task_id}`\n- 鉴权方式：`Authorization: Bearer $ARK_API_KEY`（读取已配置的环境变量 `ARK_API_KEY`）\n- 默认模型：读取环境变量 `ARK_VIDEO_MODEL`（默认 `doubao-seedance-1-0-pro-250528`）\n\n## 核心调用参数\n- `content` 数组包含：\n  - 文本镜头提示词（附加参数 `--resolution 720p --ratio 9:16 --duration 5`）\n  - 首帧图片对象（`role: \"first_frame\"` + 公网图片 URL）\n  - 尾帧图片对象（`role: \"last_frame\"` + 公网图片 URL）\n\n## 工程输出规范\n- 全部首尾帧视频任务一次性并行提交并同步轮询至 `succeeded`；\n- 将生成的本地 MP4 与公网 `video_url` 清单保存至 `manifest_videos.json`。"], ["🎙 MiniMax · Speech-2.8 同步语音合成 API 文档", "# MiniMax · Speech-2.8 同步语音合成 API 文档\n\n## 接口简介\n调用 MiniMax 高拟真语音合成模型，将旁白脚本转换为自然流畅、支持语速与情感控制的高品质人声配音。\n\n## 端点与鉴权\n- 请求地址：`POST https://api.minimax.cn/v1/t2a_v2`\n- 鉴权方式：`Authorization: Bearer $MINIMAX_API_KEY`（读取已配置的环境变量 `MINIMAX_API_KEY`）\n- 默认模型：`speech-2.8-turbo`（高保真音质可选 `speech-2.8-hd`）\n\n## 核心调用参数\n- `stream`：`false`\n- `output_format`：`\"url\"`（返回公网直连 MP3 音频地址及精确毫秒时长 `extra_info.audio_length`）\n- `audio_setting.format`：`\"mp3\"`\n\n## 常用音色参考\n- 男声普通话：`male-qn-jingying`（沉稳男声）、`male-qn-qingse`（青年男声）\n- 女声普通话：`female-yujie`（温润女声）、`female-shaonv`（清亮女声）\n- 粤语配音：请求体附加 `\"language_boost\": \"Chinese,Yue\"`"], ["✂️ CapCut Mate · 剪映草稿自动化 API 文档", "# CapCut Mate · 剪映草稿自动化 API 文档\n\n## 接口简介\nCapCut Mate（GitHub: `Hommy-master/capcut-mate`）是一款开源剪映工程自动化服务，可将图像、视频、人声配音、字幕与背景音乐自动编排为标准剪映工程草稿。\n\n## 服务地址与调用方式\n- 接口基地址：`https://capcut-mate.jcaigc.cn/openapi/capcut-mate/v1/`\n- 智能体技能指令：`/jianchuang-jianying-assistant`\n- 标准编排流水线：`create_draft (1080x1920)` → `add_videos / add_images` → `add_audios` → `add_captions` → `save_draft`\n\n## 轨道与排版规范\n1. 时间单位为微秒（1 秒 = 1,000,000），各轨道列表参数以 JSON 字符串格式提交；\n2. 推荐使用标准配乐资源：`https://assets.jcaigc.cn/bgm.mp3`（含人声配音时背景音量设为 `0.22`，纯配乐场景设为 `0.45`）；\n3. 1080×1920 竖屏字幕定位：顶部主标题 `transform_y=600`，底部同步字幕 `transform_y=-560`；\n4. 调用 `save_draft` 后返回完整草稿链接（`draft_url`），在「剪映小助手」客户端中粘贴即可生成本地剪映工程。"]]}, {"id": "shudan", "name": "📚 书单短视频", "color": "#2563eb", "bg": "#eff6ff", "steps": [["Step 1 · 书籍调研与 200 字口播文案（含 speed 语速标示）", "我现在要制作一个读书分享短视频项目。提供书名或作品名称后，请先检索整理该作品的核心信息清单：\n1. 准确书名、作者及背景信息\n2. 这部作品核心探讨的问题\n3. 最适合短视频呈现的一条主线观点\n4. 读者最容易产生共鸣的生活情境\n5. 可引用的书中观点与经典片段\n6. 需保持客观、避免过度解读的边界\n7. 适合视觉呈现的画面方向\n\n请基于以上清单撰写一版短视频口播文案：\n- 面向读书分享短视频，先提炼作品金句或核心思想，再用自然通俗的口语展开感悟总结\n- 前后逻辑连贯，富有感染力与画面感，总字数约 200 字\n- 按 s1、s2、s3 分段输出，每段附带 speed 语速参数，格式参考：s1|今天要分享的是|speed=1.2\n- 开头以 s1、s2 自然引入（例如“今天要分享的是”与“《书名》”），每句不超过 15 字，句末不加标点，句中可保留逗号或顿号\n\n请按步骤推进，第一步先完成文案撰写并保存到当前项目文件夹。\n作品名称：【请输入书名或作品名，如：人间四月天】"], ["Step 2 · MiniMax 语音合成（输出公网 MP3 音频与时长）", "请使用已配置的 MiniMax 同步语音合成接口（https://api.minimax.cn/v1/t2a_v2，模型 speech-2.8-turbo，参数 stream=false、output_format=url、format=mp3），选用【男声普通话（male-qn-jingying）/ 女声普通话（female-yujie）/ 粤语（附加 language_boost=Chinese,Yue）】，按刚才的书单文案生成自然流畅的人声朗读配音，并将公网 MP3 音频地址、音频毫秒时长及对齐字幕保存至 manifest_audio.json。"], ["Step 3 · 并发生成 6 张治愈系油画配图（9:16 竖屏）", "请根据刚才的书单文案，生成 6 张 9:16 竖屏高清配图，采用唯美治愈的油画光影风格，画面构图简洁留白以便排版字幕，整体色调高度契合作品情绪。请调用已配置的火山方舟图像模型（ARK_IMAGE_MODEL）一次性并发出图，并保存全部图片与 manifest_images.json。"], ["Step 4 · 合成 1080×1920 竖屏剪映草稿（输出 draft_url）", "/jianchuang-jianying-assistant 请使用剪映小助手技能，将刚才生成的 6 张油画配图（公网图片 URL）与分段字幕按时间顺序编排为 1080×1920 竖屏剪映草稿（画面总时长与 MiniMax 配音总时长精确对齐）。\n音频轨道：以 MiniMax 生成的公网配音 MP3 作为主音轨（volume=1.0），叠加背景轻音乐 https://assets.jcaigc.cn/bgm.mp3（volume=0.22）。\n字幕排版：顶部添加金色书名标题（transform_y=600），底部添加白色同步字幕（transform_y=-560）。\n核对全部轨道无误后保存草稿，并输出完整的草稿链接（draft_url）。"]]}, {"id": "renwu", "name": "🏛 历史人物传记", "color": "#4f46e5", "bg": "#eef2ff", "steps": [["Step 1 · 生平脉络梳理与 8 镜分镜提示词", "我现在要制作一个历史人物传记短视频项目，人物是：【请输入人物姓名，如：苏东坡 / 林徽因 / 王阳明】。\n请先梳理该人物的真实生平脉络，输出以下内容并同时保存为 TXT 和 JSON 文件至当前工作目录：\n1. 一个简练有力、富有画面感的短视频标题；\n2. 8 段生平字幕（从“1. 少年”至“8. 晚年”），每段一句话，凝练动人；\n3. 与 8 段生平一一对应的 8 段画面提示词：纯静态单幅构图、人物面部特征一致且年龄随人生阶段自然演进、每条约 100 字、9:16 竖屏比例，统一结尾为“真实历史纪录片电影质感，无文字无水印”。\n第一步先完成文案与分镜描述。"], ["Step 2 · 并发生成 8 张 9:16 高清人物竖图", "请将刚才 8 段人物画面描述全部生成为 9:16 竖屏高清图片，保持主角面部特征与历史纪录片色调高度统一。请调用已配置的火山方舟图像模型（ARK_IMAGE_MODEL）一次性并发出图，并将全部图片与 manifest_images.json 保存至当前目录。"], ["Step 3 · 并发生成 7 段首尾帧衔接视频（共 35 秒）", "请基于刚才生成的 8 张人物配图，按相邻顺序两两衔接（1图→2图、2图→3图，直至 7图→8图），一次性并行生成 7 段首尾帧转场视频（总时长 35 秒）。镜头要求缓慢平稳推进、一镜到底自然呈现年龄与场景演进，保持人物神态稳定不变形。\n输出规格：720p、9:16 竖屏、每段 5 秒、无声；请调用已配置的火山方舟视频模型（ARK_VIDEO_MODEL）并行提交并同步轮询，保存全部 MP4 文件与 URL 清单 manifest_videos.json。"], ["Step 4 · 合成人物传记剪映草稿（输出 draft_url）", "/jianchuang-jianying-assistant 请使用剪映小助手技能，将刚才生成的 7 段首尾帧视频、顶部金色人物标题（transform_y=600）、底部白色生平阶段字幕（transform_y=-560）按时间顺序合成为 1080×1920 竖屏剪映草稿，配乐使用 https://assets.jcaigc.cn/bgm.mp3（volume=0.45），核对轨道无误后输出完整的草稿链接（draft_url）。"]]}, {"id": "jiaxiang", "name": "🌆 城市 40 年变迁", "color": "#059669", "bg": "#ecfdf5", "steps": [["Step 1 · 规划 1980→2026 八个时代瞬间", "我现在要制作一部富有时代温情与共鸣的《城市 40 年变迁》微电影，目标城市是：【请输入城市名称，如：成都 / 青岛 / 长沙 / 深圳】。\n请按时间轴规划 8 个时代节点（1980、1988、1995、2002、2008、2015、2020、2026），每段输出：\n1. 一句凝练怀旧的时代字幕（不超过 18 字）；\n2. 一段约 100 字的 9:16 竖屏静态画面提示词，要求同一城市地标或街景视角随年代自然演进（从老街建筑、单车与绿皮列车，逐步演变至现代轨道交通与繁华城市天际线），统一纪实电影胶片质感，无文字无水印。\n第一步先将文案与分镜保存为 TXT 和 JSON 文件。"], ["Step 2 · 并发生成 8 张年代纪实竖图（9:16）", "请调用已配置的火山方舟图像模型（ARK_IMAGE_MODEL），将刚才 1980→2026 的全部 8 个年代画面一次性并发生成为 9:16 竖屏高清图，保存全部图片与 manifest_images.json。"], ["Step 3 · 并发生成 7 段时空演进首尾帧视频（共 35 秒）", "请调用已配置的火山方舟视频模型（ARK_VIDEO_MODEL），将相邻年代的 8 张图片两两衔接，一次性并行生成 7 段首尾帧延时穿越视频（总时长 35 秒，规格：720p / 9:16 / 5 秒 / 无声）。要求保持固定机位，建筑与街道呈现自然流畅的时空演进感，全部任务并发提交并同步轮询。"], ["Step 4 · 合成城市变迁剪映草稿（输出 draft_url）", "/jianchuang-jianying-assistant 请使用剪映小助手技能，将 7 段年代演进视频、顶部金色《XX 40年变迁》主标题（transform_y=600）、底部白色年代字幕（transform_y=-560）按顺序合成为 1080×1920 竖屏剪映草稿，配乐使用 https://assets.jcaigc.cn/bgm.mp3（volume=0.45），完成后输出完整的草稿链接（draft_url）。"]]}, {"id": "gushi", "name": "📜 古诗词国风动画", "color": "#7c3aed", "bg": "#f5f3ff", "steps": [["Step 1 · 拆解古诗词为 8 镜国风电影分镜", "我现在要制作一部帮助青少年直观理解意境的《古诗词国风动画短片》，诗词是：【请输入诗词名称，如：李白《将进酒》 / 陶渊明《桃花源记》】。\n请按诗句意境拆解为 8 个核心镜头，每段输出：\n1. 原诗句 + 一句通俗易懂的意境赏析；\n2. 对应的 9:16 竖屏国风电影级画面提示词（新中式水墨光影与写实古风融合，保持人物服饰与画风前后一致，无文字无水印）。\n第一步先输出文本与分镜并保存为 TXT 和 JSON 文件。"], ["Step 2 · 并发生成 8 张新中式国风竖图", "请调用已配置的火山方舟图像模型（ARK_IMAGE_MODEL），将刚才 8 镜古诗词分镜一次性并发生成为 9:16 国风竖屏高清图，保存全部图片与 manifest_images.json。"], ["Step 3 · 并发生成 7 段水墨意境首尾帧动画（共 35 秒）", "请调用已配置的火山方舟视频模型（ARK_VIDEO_MODEL），将 8 张国风分镜图两两衔接，一次性并行生成 7 段首尾帧动画视频（总时长 35 秒，规格：720p / 9:16 / 5 秒 / 无声）。运镜舒缓飘逸，云雾流水与衣袂轻扬，全部任务并行提交并同步轮询。"], ["Step 4 · 合成古诗词剪映草稿（支持可选 MiniMax 朗诵）", "/jianchuang-jianying-assistant 请使用剪映小助手技能，将 7 段古诗词动画视频合成为 1080×1920 竖屏剪映草稿。如需配朗诵旁白，可先调用已配置的 MiniMax 语音合成接口（speech-2.8-turbo，stream=false，output_format=url，音色 male-qn-jingying）生成公网配音轨（volume=1.0）。\n画面搭配顶部金色诗名标题（transform_y=600）、底部白色原诗句字幕（transform_y=-560）以及背景音乐 https://assets.jcaigc.cn/bgm.mp3（含配音时 volume=0.22，纯配乐时 volume=0.45），完成后输出完整的草稿链接（draft_url）。"]]}, {"id": "maopi", "name": "🏠 室内空间改造", "color": "#ea580c", "bg": "#fff7ed", "steps": [["Step 1 · 固定机位规划 8 阶段空间改造脚本", "我现在要制作一部沉浸式《毛坯空间 8 步精装演进》延时改造短片，空间与风格是：【请输入空间与风格，如：奶油原木风客厅 / 新中式茶室 / 精品咖啡馆】。\n请严格锁定同一个广角室内机位，规划 8 个递进施工阶段（1.纯水泥毛坯 → 2.水电与隔墙 → 3.地面铺装完成 → 4.墙面与吊顶完工 → 5.定制柜体安装 → 6.主家具进场 → 7.窗帘绿植软装 → 8.傍晚暖光氛围全开的成品空间）。\n每段输出一句简洁进度字幕与约 100 字建筑摄影级提示词，明确保持机位、窗户及空间结构完全一致，无文字无水印。先保存为 TXT 和 JSON 文件。"], ["Step 2 · 并发生成 8 张同机位改造阶段图", "请调用已配置的火山方舟图像模型（ARK_IMAGE_MODEL），将刚才全部 8 个施工阶段一次性并发生成为 9:16 竖屏高清图，严格保持相同机位与户型结构一致，并保存 manifest_images.json。"], ["Step 3 · 并发生成 7 段空间延时生长视频（共 35 秒）", "请调用已配置的火山方舟视频模型（ARK_VIDEO_MODEL），将相邻改造阶段图两两衔接，一次性并行生成 7 段延时摄影风格的首尾帧视频（总时长 35 秒，规格：720p / 9:16 / 5 秒 / 无声）。镜头保持完全固定，自然呈现硬装、家具与灯光依次成型的空间变化过程。"], ["Step 4 · 合成空间改造剪映草稿（输出 draft_url）", "/jianchuang-jianying-assistant 请使用剪映小助手技能，将 7 段空间改造延时视频、顶部金色风格标题（transform_y=600）、底部白色施工进度字幕（transform_y=-560）按顺序合成为 1080×1920 竖屏剪映草稿，配乐使用 https://assets.jcaigc.cn/bgm.mp3（volume=0.45），完成后输出完整的草稿链接（draft_url）。"]]}, {"id": "yangsheng", "name": "🍵 节气食养科普", "color": "#0d9488", "bg": "#f0fdfa", "steps": [["Step 1 · 撰写 200 字合规食养科普文案与 6 图分镜", "我现在要制作一条温和易传播的《节气与日常食养科普》短视频，主题是：【请输入节气或主题，如：立冬润肺 / 温和养胃 / 舒缓助眠】。\n请用温和、客观、合规（聚焦日常饮食搭配与规律作息，不做夸大疗效表述）的口吻输出：\n1. 约 200 字分段口播文案（格式 s1|文本|speed=1.1，每句不超过 15 字，句末不加标点）；\n2. 6 张 9:16 竖屏新中式治愈系配图提示词（如温热茶汤、天然食材微距特写、清晨窗边光影等，构图留白适合排版字幕，无文字无水印）。\n第一步先保存文案与配图提示词至本地文件。"], ["Step 2 · 并发生成 6 张新中式治愈系配图", "请调用已配置的火山方舟图像模型（ARK_IMAGE_MODEL），将刚才 6 段新中式食养配图提示词一次性并发生成为 9:16 竖屏高清图，保存全部图片与 manifest_images.json。"], ["Step 3 · MiniMax 温润女声配音 + 合成科普剪映草稿", "/jianchuang-jianying-assistant 请先调用已配置的 MiniMax 同步语音合成接口（https://api.minimax.cn/v1/t2a_v2，模型 speech-2.8-turbo，stream=false，output_format=url，format=mp3），选用温润女声（female-yujie，speed=1.05）生成整段科普文案的公网配音 MP3。\n随后使用剪映小助手技能，将这 6 张新中式配图（按配音总时长均匀排布）、MiniMax 人声主轨（volume=1.0）、背景轻音乐 https://assets.jcaigc.cn/bgm.mp3（volume=0.22）、顶部金色主标题（transform_y=600）与底部白色科普字幕（transform_y=-560）合成为 1080×1920 竖屏剪映草稿，并输出完整的草稿链接（draft_url）。"]]}, {"id": "shangye", "name": "🎬 品牌产品宣传", "color": "#b91c1c", "bg": "#fef2f2", "steps": [["场景 A · 产品 8 步匠心溯源微电影（全流程）", "我现在要为一个实体品牌打造一条电影级《产品 8 步匠心溯源》品牌宣传短片，产品是：【请输入产品名称，如：英德红茶 / 手工皮具 / 古法酿造酱油 / 定制木作】。\n请规划从“源头原料 → 核心工艺 → 品质检验 → 雅致使用场景”的 8 步递进分镜：\n1. 每步一句真实可信的旁白字幕（突出原料与工艺细节，表述客观克制）；\n2. 每步一段 9:16 竖屏商业广告摄影级提示词（微距质感、自然高级光影、无文字无水印）。\n请先保存 TXT 和 JSON 分镜脚本；确认后依次调用已配置的火山方舟模型并发生成 8 张完整分镜图 → 两两衔接并行生成 7 段首尾帧视频（共 35 秒） → 使用 /jianchuang-jianying-assistant 合成 1080×1920 竖屏剪映草稿（配乐 https://assets.jcaigc.cn/bgm.mp3），并输出完整的草稿链接（draft_url）。"], ["场景 B · 线下品牌 15 秒商业故事板分镜", "我经营【请输入行业与主营产品，如：茶叶 / 定制软装 / 精品烘焙】线下门店与源头供应链，品牌名为【请输入品牌名称】，希望面向同城与线上客户展示门店环境、产品材质细节、丰富品类及售后保障。\n请设计一套 15 秒竖屏品牌短片故事板，包含人物设定、空间场景、4–6 镜剧情分镜与口播脚本，并输出带清晰中文标注的专业商业分镜画板提示词。"]]}, {"id": "lvyou", "name": "🗺 城市文旅名片", "color": "#0284c7", "bg": "#f0f9ff", "steps": [["Step 1 · 城市 8 大经典地标文旅脚本", "【城市文旅名片】目标城市：【请输入城市名称，如：杭州 / 重庆 / 西安】。\n请精选这座城市最具代表性的 8 处经典人文与自然地标，每段输出：\n1. 一句凝练且富有画面感的文旅解说字幕（不超过 20 字）；\n2. 一段约 100 字的 9:16 竖屏电影级航拍与实景风光提示词（光影通透、人文氛围浓厚、无文字无水印）。\n第一步先输出文案与画面提示词并保存为 TXT 和 JSON 文件。"], ["Step 2 · 并发出图 + 7 段航拍转场视频 + 输出草稿链接", "请调用已配置的火山方舟模型：先用 ARK_IMAGE_MODEL 一次性并发生成全部 8 大地标的 9:16 高清风光竖图，再用 ARK_VIDEO_MODEL 将 8 张图两两衔接并行生成 7 段首尾帧 5 秒 720p 无声航拍转场视频（总时长 35 秒）。\n最后使用 /jianchuang-jianying-assistant 剪映小助手技能，合成为 1080×1920 竖屏剪映草稿（含顶部金色城市标题 transform_y=600、底部白色地标字幕 transform_y=-560 与背景音乐 https://assets.jcaigc.cn/bgm.mp3），并输出完整的草稿链接（draft_url）。"]]}, {"id": "board", "name": "📋 课程体系与路径", "color": "#334155", "bg": "#f1f5f9", "steps": [["模块一 · AI 智能体四阶段系统学习路径", "1、【入门阶段】以创意项目快速上手：城市变迁、古诗词动画、读书分享短视频\n   目标：掌握让 AI 协同完成文案、视觉生成、语音合成、动态视频与自动剪辑的完整流程\n\n2、【进阶阶段】落地商业内容生产力：室内空间改造、产品匠心溯源、品牌视觉分镜\n   目标：大幅提升内容策划、视觉制作与短视频剪辑效率\n\n3、【升级阶段】零代码构建实用工具：交互式小游戏、学习辅导小程序、经营数据可视化大屏\n   目标：将 AI 能力延伸至日常办公提效与家庭学习辅导场景\n\n4、【综合阶段】搭建个人 AI 知识库与专属业务工作台\n   目标：掌握底层工程化思维，面对新一代 AI 工具持续迁移复用"], ["模块二 · 系统化学习与碎片化自学的核心差异", "为什么从零自学容易半途而废？\n1. 知识碎片化 —— 零散浏览各类教程，难以串联为可落地的端到端工作流\n2. 缺乏实时排错 —— 环境配置、接口联调遇到细节报错，容易耗费大量时间停滞不前\n3. 工具迭代迅速 —— AI 生态月度更新，缺乏体系指导往往还没跑通流程，方法已经过时"], ["模块三 · 课程核心体系与学习支持", "课程整体交付与学习支持：\n1. 19 大核心模块系统实战课（全面覆盖 Codex / WorkBuddy / 多模态工作流）\n2. 飞书结构化图文 SOP 手册与 50+ 行业标准化指令、工程模板及技能包\n3. 实战答疑社群（每日 10:00–22:00 协助排查环境配置与项目运行问题）\n4. 每周 2 次定期线上专题实操与作业点评（周三行业工作台搭建 + 周六案例复盘）\n5. 支持多端随时回看，持续同步前沿 AI 工具与更新课程案例"]]}];
const tabsEl = document.getElementById('tabs');
const container = document.getElementById('container');

let activeId = 'all';

function copyText(text, btn) {
  const done = () => {
    btn.textContent = '✓ 已复制';
    btn.classList.add('done');
    setTimeout(() => { btn.textContent = '📋 复制指令'; btn.classList.remove('done'); }, 1800);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, cb) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  cb();
}

function renderTabs() {
  tabsEl.innerHTML = '';
  const allBtn = document.createElement('button');
  allBtn.className = 'tab' + (activeId === 'all' ? ' active' : '');
  allBtn.textContent = '✨ 全部模块（10类 · 34条）';
  allBtn.onclick = () => { activeId = 'all'; renderTabs(); renderContent(); };
  tabsEl.appendChild(allBtn);

  PROJECTS.forEach(p => {
    const b = document.createElement('button');
    b.className = 'tab' + (activeId === p.id ? ' active' : '');
    b.textContent = p.name;
    b.onclick = () => { activeId = p.id; renderTabs(); renderContent(); };
    tabsEl.appendChild(b);
  });
}

function renderContent() {
  container.innerHTML = '';
  const list = activeId === 'all' ? PROJECTS : PROJECTS.filter(p => p.id === activeId);
  list.forEach(p => {
    const sec = document.createElement('div');
    sec.className = 'section-wrap';
    sec.innerHTML = `
      <div class="sec-header">
        <div class="sec-title">${p.name} <span class="sec-count">共 ${p.steps.length} 项</span></div>
      </div>
      <div class="grid"></div>
    `;
    const grid = sec.querySelector('.grid');
    p.steps.forEach(([title, text]) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-head">
          <div>
            <span class="badge" style="background:${p.bg};color:${p.color}">${p.name}</span>
            <div class="title">${title}</div>
          </div>
          <button class="copy-btn">📋 复制指令</button>
        </div>
        <pre></pre>
      `;
      card.querySelector('pre').textContent = text;
      const btn = card.querySelector('.copy-btn');
      btn.onclick = () => copyText(text, btn);
      grid.appendChild(card);
    });
    container.appendChild(sec);
  });
}

renderTabs();
renderContent();
</script>
</body>
