<script>
const PROJECTS = [{"id": "manuals", "name": "📖 技能接口文档", "color": "#7c3aed", "bg": "#f5f3ff", "steps": [["🎨 火山方舟 · Seedream 图像生成 API 文档", "# 火山方舟 · Seedream 图像生成 API 文档\n\n## 接口简介\n调用火山方舟豆包文生图大模型，支持批量并发生成 9:16 高清电影级竖屏分镜画面。\n\n## 端点与鉴权\n- 请求地址：`POST https://ark.cn-beijing.volces.com/api/v3/images/generations`\n- 鉴权方式：`Authorization: Bearer $ARK_API_KEY`（读取已配置的环境变量 `ARK_API_KEY`）\n- 固定模型：`doubao-seedream-5-0-flash-260915`（读取环境变量 `ARK_IMAGE_MODEL`，仅使用此模型）\n\n## 核心调用参数\n- `size`：`\"1440x2560\"`（9:16 高清竖屏比例，提示词使用 UTF-8 编码）\n- `response_format`：`\"url\"`（返回公网直连图片 URL，供后续视频生成与草稿合成直接引用）\n- `watermark`：`false`\n\n## 工程输出规范\n- 多张配图任务采用多线程或异步方式一次性并发提交，一轮直接出完；\n- 将全部图片文件与公网 URL 清单直接保存至当前文件夹（不在对话窗口直接渲染展示图片）。"], ["🎬 火山方舟 · Seedance 首尾帧视频生成 API 文档", "# 火山方舟 · Seedance 首尾帧视频生成 API 文档\n\n## 接口简介\n调用火山方舟豆包视频生成大模型，将相邻两张静态画面作为首帧与尾帧，批量并发生成平滑衔接视频。\n\n## 端点与鉴权\n- 提交任务：`POST https://ark.cn-beijing.volces.com/api/v3/contents/generations/tasks`\n- 查询状态：`GET https://ark.cn-beijing.volces.com/api/v3/contents/generations/tasks/{task_id}`\n- 鉴权方式：`Authorization: Bearer $ARK_API_KEY`（读取已配置的环境变量 `ARK_API_KEY`）\n- 固定模型：`doubao-seedance-2-0-mini-260615`（`480p` 无声 `generate_audio: false`，仅使用此模型）\n\n## 核心调用参数\n- `content` 数组包含：\n  - 文本镜头提示词（附加参数 `--resolution 480p --ratio 9:16 --duration 5 --watermark false`）\n  - 首帧图片对象（`role: \"first_frame\"` + 公网图片 URL）\n  - 尾帧图片对象（`role: \"last_frame\"` + 公网图片 URL）\n\n## 工程输出规范\n- 全部首尾帧视频任务一次性并行提交并同步轮询至 `succeeded`；\n- 将生成的本地 MP4 与公网 `video_url` 清单保存至 `manifest_videos.json`（不在对话窗口直接展示视频）。"], ["🎙 MiniMax · Speech-2.8 同步语音合成 API 文档", "# MiniMax · Speech-2.8 同步语音合成 API 文档\n\n## 接口简介\n调用 MiniMax 高拟真语音合成模型，将旁白脚本一次性合成为自然流畅的高品质人声配音。\n\n## 端点与鉴权\n- 请求地址：`POST https://api.minimax.cn/v1/t2a_v2`\n- 鉴权方式：`Authorization: Bearer $MINIMAX_API_KEY`（读取已配置的环境变量 `MINIMAX_API_KEY`）\n- 默认模型：`speech-2.8-turbo`（固定仅使用此模型）\n\n## 核心调用参数\n- `stream`：`false`\n- `output_format`：`\"url\"`（返回公网直连 MP3 音频地址及精确毫秒时长 `extra_info.audio_length`）\n- `audio_setting.format`：`\"mp3\"`（整篇口播合并单次请求快速出音，避免逐句频繁请求触发限流）\n\n## 常用音色参考\n- 男声普通话：`male-qn-jingying`（沉稳男声）、`male-qn-qingse`（青年男声）\n- 女声普通话：`female-yujie`（温润女声）、`female-shaonv`（清亮女声）\n- 粤语配音：请求体附加 `\"language_boost\": \"Chinese,Yue\"`"], ["✂️ CapCut Mate · 剪映草稿自动化 API 文档", "# CapCut Mate · 剪映草稿自动化 API 文档\n\n## 接口简介\nCapCut Mate（GitHub: `Hommy-master/capcut-mate`）是一款开源剪映工程自动化服务，可将图像、视频、人声配音、字幕与背景音乐自动编排为标准剪映工程草稿。\n\n## 服务地址与调用方式\n- 接口基地址：`https://capcut-mate.jcaigc.cn/openapi/capcut-mate/v1/`（官方文档：`https://docs.jcaigc.cn/`）\n- 智能体技能指令：`/jianchuang-jianying-assistant`\n- 标准编排流水线：`create_draft (1080x1920)` → `add_videos / add_images` → `add_audios` → 两次 `add_captions`（分别添加顶部标题与底部字幕）→ `save_draft`\n\n## 轨道与排版规范\n1. 时间单位为微秒（1 秒 = 1,000,000），各轨道列表参数以 JSON 字符串格式提交；\n2. 顶部标题推荐样式：`font=\"江湖体\"`，`font_size=15`，`text_color=\"#ffffff\"`，`border_color=\"#000000\"`，`line_spacing=10`，`transform_y=1369`；\n3. 底部字幕推荐样式：`font=\"江湖体\"`，`font_size=12`，`text_color=\"#ffde00\"`，`border_color=\"#000000\"`，`line_spacing=10`，`transform_y=-794`；\n4. 调用 `save_draft` 后返回完整草稿链接（`draft_url`），在「剪映小助手」客户端中粘贴即可生成本地剪映工程。"]]}, {"id": "renwu", "name": "🏛 历史人物传记", "color": "#4f46e5", "bg": "#eef2ff", "steps": [["Step 1 · 历史人物剧本制作（标题 + 8 段生平 + 画面描述）", "接下来在这个对话窗口一定不要返回或者出现配图或者视频，切记把所有的内容直接保存到文件夹中，不要直接展示。\n\n1. 标题：\n我现在要做一个历史人物讲解的视频，要先做剧本，我的第一个任务就是要做一个标题，现在我给你一个历史人物名字，你帮我返回一个标题，比如秦始皇统一天下的一生，成吉思汗征战的一生。记住帮我保存到我的文件夹里面，名字：李清照\n\n2. 生平经历：\n我需要根据人物的标题，来做他的生平经历字幕，不要太长简短一些，返回8段历史人物的生平经历。格式按照[年龄]:[事件]的方式。记住帮我保存到我的文件夹里面。\n\n3. 画面描述：\n我还需要做每段字幕所对应详细的画面描述，当作下一步做图工具来用的提示词，要求描述尽量详细一些，不少于50个字，静态描述，只描述当前经历的一个画面内容，每段描述最后加上一句：真实古代纪录片风格。记住帮我保存到我的文件夹里面。"], ["Step 2 · 根据画面描述并发作图（9:16 竖屏）", "参考这个图像生成API文档内容，帮我调用画图API，我需要得到的图的比例是9:16（指定使用 doubao-seedream-5-0-flash-260915 模型），输入的参考提示词就是刚才得到的每一个画面描述（在API调用时，必须将提示词转成UTF-8编码），把全部8张图片一次性并行做出来，最后把图片和生成的公网链接结果直接保存到文件夹里，不要在对话窗口展示图片。"], ["Step 3 · 根据图片首尾帧生成 7 段视频（共 35 秒）", "阅读这个视频生成API文档，帮我把8张图片按照顺序，首尾帧生成7段视频，一定要按照顺序，比如第一段视频用第一张图和第二张图生成，第二段视频用第二张和第三张图去生成，这样子按照人物生平经历的时间顺序去生成视频，规格统一使用 Doubao-Seedance-2.0-mini 模型、480p、9:16竖屏、每段5秒、无声版本（generate_audio=false），并行地去做视频，把视频和生成的公网链接保存到本地文件夹，不要在对话窗口展示视频。"], ["Step 4 · 剪映小助手自动剪辑（江湖体 + 分类史诗配乐）", "/jianchuang-jianying-assistant 参考文档 https://docs.jcaigc.cn/docs/save_draft.zh.html 进行剪辑：\n先使用 create_draft 创建一个草稿，草稿的比例是 1080*1920；然后 add_videos 按顺序添加刚才生成的历史人物视频（直接使用生成视频自带的公网链接），注意时间线参数的使用方法（7段视频每段都需要有时间线，让它们连接在一起，每段5秒连接后就是35秒）。\n再使用两次 add_captions 分别完成标题和字幕的添加，注意字幕要和视频内容对应上，标题添加到上面，字幕添加到下面：\n- 添加标题的参数：border_color #000000，font 江湖体，font_size 15，line_spacing 10，text_color #ffffff，transform_y 1369（标题就是做剧本时候生成的标题）\n- 添加字幕的参数：border_color #000000，font 江湖体，font_size 12，line_spacing 10，text_color #ffde00，transform_y -794（字幕就是做剧本时候生成的生平经历）\n\n给这个视频加上音频，参考 add_audios（https://docs.jcaigc.cn/docs/add_audios.zh.html），音频时间线需要和视频总长度一致：\n- 若为中国历史男性名人，从下面音乐中随机选一首：\n  1) https://videotourl.com/audio/1783527464513-922e5efb-b710-4af1-a450-25e4a619d33a.mp3\n  2) https://coze-coding-project.tos.coze.site/coze_storage_7620810618169425926/54bcbaa6-d144-49c5-a903-1d0e691b8259_1788426120125_7777b6ff.mp3?sign=1819962120-2726c43f90-0-935830b6e74d60018843938b1cd06f9eb66e966a41e4e7a8ba7dd7d8d585a8ab\n  3) https://coze-coding-project.tos.coze.site/coze_storage_7620810618169425926/f456c36f-1fcf-46b8-ae46-b7fa0810aed8_1789121167363_9b1c5336.mp3?sign=1820657167-02ab4f18b3-0-cc67b45d4e87f23632cbc3c02b84e824c8696838ec94df8daec004f263d10c4c\n- 若为中国历史名将：\n  https://coze-coding-project.tos.coze.site/coze_storage_7620810618169425926/2943f044-0273-42ee-a876-ba9d65836f42_1789121092569_094f8df0.mp3?sign=1820657093-af7e00b609-0-05ea34d93257e19fa8c034d6fbc664988c13a8867c88b8a2708e08916585d8dd\n- 若为中国历史女性名人：\n  https://coze-coding-project.tos.coze.site/coze_storage_7620810618169425926/5b52666c-abad-490c-8ce4-7259c04208c9_1788626743353_84835455.mp3?sign=1820162743-2d4f48419e-0-c2c06bbc0557c0c64aad5fa0d56c1dcd23979d2abe6477a66d4d752e897129af\n- 若为国外历史名人：\n  https://coze-coding-project.tos.coze.site/coze_storage_7620810618169425926/d2ca44a9-675e-416a-80d2-d7af500293ae_1788411459030_bfe69503.mp3?sign=1819947459-1e0b81efed-0-ab401cacc391ae883f458188cb10636544440230ebfaca3a30e7c00a25c8e824\n\n最后使用 save_draft 保存草稿并输出剪映草稿链接（draft_url）。"]]}, {"id": "shudan", "name": "📚 书单短视频", "color": "#2563eb", "bg": "#eff6ff", "steps": [["Step 1 · 撰写 200 字读书口播文案", "接下来在这个对话窗口一定不要返回或者出现配图或者视频，切记把所有的内容直接保存到文件夹中，不要直接展示。\n\n我现在要做一个读书分享短视频，先写口播文案。\n请先了解下面这本书的核心内容与最打动人的观点，写一版约 200 字的口播文案：\n- 开头用金句或核心观点引入，接着用自然通俗的口语展开感悟总结，逻辑连贯、有画面感\n- 按 s1、s2、s3 分段输出并标注语速，格式参考：s1|今天要分享的是|speed=1.2\n- 每句不超过 15 字，句末不加标点，句中可保留逗号或顿号\n请先把文案保存到当前文件夹，暂不配音和出图。\n\n书名：人间四月天"], ["Step 2 · MiniMax 语音合成真人配音", "请使用 MiniMax 语音合成接口，选用【男声普通话（male-qn-jingying）/ 女声普通话（female-yujie）/ 粤语】，将刚才的书单文案整篇一次性快速生成人声朗读配音（单次合成整段音频，避免逐句请求限流），并把公网 MP3 链接与音频时长保存到当前文件夹。"], ["Step 3 · 并发生成 6 张治愈系油画配图", "根据刚才的书单文案，一次性并行生成 6 张 9:16（指定使用 doubao-seedream-5-0-flash-260915 模型） 竖屏高清配图（提示词转成 UTF-8 编码），采用唯美治愈的油画光影风格，构图简洁留白、画面无任何字迹，直接把图片和公网链接保存到当前文件夹，不要在对话窗口展示图片。"], ["Step 4 · 一键合成书单剪映草稿", "/jianchuang-jianying-assistant 请使用剪映小助手技能，把刚才生成的 6 张油画配图（使用自带公网链接）、MiniMax 人声配音、轻音乐垫底（https://assets.jcaigc.cn/bgm.mp3，volume=0.22）、顶部书名标题（江湖体，#ffffff 白字黑边，transform_y=1369）与底部同步字幕（江湖体，#ffde00 黄字黑边，transform_y=-794）合成为 1080×1920 竖屏剪映草稿（画面时长对齐配音总时长），完成后直接输出草稿链接（draft_url）。"]]}, {"id": "jiaxiang", "name": "🌆 城市 40 年变迁", "color": "#059669", "bg": "#ecfdf5", "steps": [["Step 1 · 规划 1980→2026 八个时代瞬间", "接下来在这个对话窗口一定不要返回或者出现配图或者视频，切记把所有的内容直接保存到文件夹中，不要直接展示。\n\n我现在要做一个《城市 40 年变迁》短视频，先做剧本。\n请按时间轴规划 8 个时代节点（1980、1988、1995、2002、2008、2015、2020、2026）：\n1. 一个简短有共鸣的标题（比如：深圳 40 年变迁）；\n2. 每段一句简短的年代字幕（格式「[年份]:[画面感短句]」，不超过 16 字）；\n3. 每段对应的详细静态画面描述（不少于 50 字，只描述当前年代的一个静态街景或地标画面，结尾加上一句：真实纪实电影胶片风格）。\n记住帮我保存到我的文件夹里面，城市：深圳"], ["Step 2 · 并发生成 8 张年代纪实竖图", "参考图像生成API文档，比例 9:16（指定使用 doubao-seedream-5-0-flash-260915 模型），把刚才得到的 8 个年代画面描述（提示词转成 UTF-8 编码）一次性并行生成 8 张图片，把图片和公网链接直接保存到文件夹里，不要在对话窗口展示图片。"], ["Step 3 · 并发生成 7 段时空演进视频", "阅读视频生成API文档，把 8 张年代图片按照顺序首尾帧并行生成 7 段视频（第一段用第一张和第二张，第二段用第二张和第三张，依此类推，每段 5 秒共 35 秒），把视频和公网链接保存到本地文件夹，不要在对话窗口展示视频。"], ["Step 4 · 一键合成城市变迁草稿", "/jianchuang-jianying-assistant 请使用剪映小助手技能，把 7 段年代演进视频（使用自带公网链接）、顶部标题（江湖体，白字黑边，transform_y=1369）、底部年代字幕（江湖体，黄字黑边，transform_y=-794）和背景音乐合成为 1080×1920 竖屏剪映草稿，完成后直接输出草稿链接（draft_url）。"]]}, {"id": "gushi", "name": "📜 古诗词国风动画", "color": "#7c3aed", "bg": "#f5f3ff", "steps": [["Step 1 · 拆解 8 镜国风诗意分镜", "接下来在这个对话窗口一定不要返回或者出现配图或者视频，切记把所有的内容直接保存到文件夹中，不要直接展示。\n\n我现在要做一个《古诗词国风动画》短视频，先做分镜脚本。\n请按诗句意境拆解为 8 个镜头：\n1. 每镜一句原诗句 + 一句简洁的意境赏析；\n2. 每镜一段详细的静态画面描述（不少于 50 字，只描述当前镜头的一个静态画面，新中式水墨与写实古风结合，结尾加上一句：真实国风电影动画风格）。\n记住帮我保存到我的文件夹里面，诗词：李白《将进酒》"], ["Step 2 · 并发生成 8 张新中式国风竖图", "参考图像生成API文档，比例 9:16（指定使用 doubao-seedream-5-0-flash-260915 模型），把刚才保存的 8 镜古诗词画面描述（提示词转成 UTF-8 编码）一次性并行生成 8 张国风图片，直接保存全部图片与公网链接到文件夹，不要在对话窗口展示图片。"], ["Step 3 · 并发生成 7 段国风动画视频", "阅读视频生成API文档，把 8 张国风分镜图按照顺序首尾帧并行生成 7 段动画视频（使用 Doubao-Seedance-2.0-mini 模型，480p、9:16竖屏、每段5秒共35秒、无声版本），保存全部视频与公网链接到本地文件夹，不要在对话窗口展示视频。"], ["Step 4 · 一键合成古诗词剪映草稿", "/jianchuang-jianying-assistant 请使用剪映小助手技能，把 7 段古诗词动画视频（使用自带公网链接）、顶部诗名标题（江湖体，白字黑边，transform_y=1369）、底部原诗句字幕（江湖体，黄字黑边，transform_y=-794）和古风史诗配乐合成为 1080×1920 竖屏剪映草稿，完成后直接输出草稿链接（draft_url）。"]]}, {"id": "maopi", "name": "🏠 室内空间改造", "color": "#ea580c", "bg": "#fff7ed", "steps": [["Step 1 · 固定机位 8 阶段空间改造脚本", "接下来在这个对话窗口一定不要返回或者出现配图或者视频，切记把所有的内容直接保存到文件夹中，不要直接展示。\n\n我现在要做一个《毛坯空间 8 步精装演进》延时改造短视频，先做分镜脚本。\n请固定同一个广角室内视角，规划 8 个递进施工阶段（1.水泥毛坯 → 2.水电隔墙 → 3.地面铺装 → 4.墙面吊顶 → 5.定制柜体 → 6.主家具进场 → 7.窗帘绿植软装 → 8.傍晚暖灯全开成品）。\n每段写一句简短进度字幕 + 一段不少于 50 字的静态建筑画面描述，结尾加上一句：真实高端室内摄影风格。\n记住帮我保存到我的文件夹里面，空间与风格：奶油原木风客厅"], ["Step 2 · 并发生成 8 张同机位改造图", "参考图像生成API文档，比例 9:16（指定使用 doubao-seedream-5-0-flash-260915 模型），把刚才保存的 8 个施工阶段描述（提示词转成 UTF-8 编码）一次性并行生成 8 张竖屏图片，直接保存全部图片与公网链接到文件夹，不要在对话窗口展示图片。"], ["Step 3 · 并发生成 7 段空间延时生长视频", "阅读视频生成API文档，把相邻阶段的 8 张改造图按顺序首尾帧并行生成 7 段延时视频（使用 Doubao-Seedance-2.0-mini 模型，480p、9:16竖屏、每段5秒共35秒、无声版本），保存全部视频与公网链接到本地文件夹，不要在对话窗口展示视频。"], ["Step 4 · 一键合成空间改造草稿", "/jianchuang-jianying-assistant 请使用剪映小助手技能，把 7 段空间改造延时视频（使用自带公网链接）、顶部风格标题（江湖体，白字黑边，transform_y=1369）、底部进度字幕（江湖体，黄字黑边，transform_y=-794）和背景音乐合成为 1080×1920 竖屏剪映草稿，完成后直接输出草稿链接（draft_url）。"]]}, {"id": "yang p 无声航拍转场视频（Doubao-Seedance-2.0-mini）（不在对话窗展示图片视频），最后使用 /jianchuang-jianying-assistant 合成为 1080×1920 竖屏剪映草稿（江湖体上白下黄字幕）并输出草稿链接（draft_url）。"]]}, {"id": "board", "name": "📋 课程体系与路径", "color": "#334155", "bg": "#f1f5f9", "steps": [["模块一 · AI 智能体四阶段系统学习路径", "1、【入门阶段】以创意项目快速上手：历史人物、城市变迁、古诗词动画、读书分享短视频\n   目标：掌握让 AI 协同完成文案、视觉生成、语音合成、动态视频与自动剪辑的完整流程\n\n2、【进阶阶段】落地商业内容生产力：室内空间改造、产品匠心溯源、品牌视觉分镜\n   目标：大幅提升内容策划、视觉制作与短视频剪辑效率\n\n3、【升级阶段】零代码构建实用工具：交互式小游戏、学习辅导小程序、经营数据可视化大屏\n   目标：将 AI 能力延伸至日常办公提效与家庭学习辅导场景\n\n4、【综合阶段】搭建个人 AI 知识库与专属业务工作台\n   目标：掌握底层工程化思维，面对新一代 AI 工具持续迁移复用"], ["模块二 · 系统化学习与碎片化自学的核心差异", "为什么从零自学容易半途而废？\n1. 知识碎片化 —— 零散浏览各类教程，难以串联为可落地的端到端工作流\n2. 缺乏实时排错 —— 环境配置、接口联调遇到细节报错，容易耗费大量时间停滞不前\n3. 工具迭代迅速 —— AI 生态月度更新，缺乏体系指导往往还没跑通流程，方法已经过时"], ["模块三 · 课程核心体系与学习支持", "课程整体交付与学习支持：\n1. 19 大核心模块系统实战课（全面覆盖 Codex / WorkBuddy / 多模态工作流）\n2. 飞书结构化图文 SOP 手册与 50+ 行业标准化指令、工程模板及技能包\n3. 实战答疑社群（每日 10:00–22:00 协助排查环境配置与项目运行问题）\n4. 每周 2 次定期线上专题实操与作业点评（周三行业工作台搭建 + 周六案例复盘）\n5. 支持多端随时回看，持续同步前沿 AI 工具与更新课程案例"]]}];
const tabsEl = document.getElementById('tabs');
const container = document.getElementById('container');

let activeId = 'all';

function copyText(text, btn) {
  const done = () => {
    btn.textContent = '✓ 已复制';
    btn.classList.add('done');
    setTimeout(() => { btn.textContent = '📋 复制指令'; btn.classList.remove('done'); }, 1800);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, cb) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  cb();
}

function renderTabs() {
  tabsEl.innerHTML = '';
  const allBtn = document.createElement('button');
  allBtn.className = 'tab' + (activeId === 'all' ? ' active' : '');
  allBtn.textContent = '✨ 全部模块（10类 · 34条）';
  allBtn.onclick = () => { activeId = 'all'; renderTabs(); renderContent(); };
  tabsEl.appendChild(allBtn);

  PROJECTS.forEach(p => {
    const b = document.createElement('button');
    b.className = 'tab' + (activeId === p.id ? ' active' : '');
    b.textContent = p.name;
    b.onclick = () => { activeId = p.id; renderTabs(); renderContent(); };
    tabsEl.appendChild(b);
  });
}

function renderContent() {
  container.innerHTML = '';
  const list = activeId === 'all' ? PROJECTS : PROJECTS.filter(p => p.id === activeId);
  list.forEach(p => {
    const sec = document.createElement('div');
    sec.className = 'section-wrap';
    sec.innerHTML = `
      <div class="sec-header">
        <div class="sec-title">${p.name} <span class="sec-count">共 ${p.steps.length} 项</span></div>
      </div>
      <div class="grid"></div>
    `;
    const grid = sec.querySelector('.grid');
    p.steps.forEach(([title, text]) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-head">
          <div>
            <span class="badge" style="background:${p.bg};color:${p.color}">${p.name}</span>
            <div class="title">${title}</div>
          </div>
          <button class="copy-btn">📋 复制指令</button>
        </div>
        <pre></pre>
      `;
      card.querySelector('pre').textContent = text;
      const btn = card.querySelector('.copy-btn');
      btn.onclick = () => copyText(text, btn);
      grid.appendChild(card);
    });
    container.appendChild(sec);
  });
}

renderTabs();
renderContent();
</script>
